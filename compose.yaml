services:
  maintenance-api:
    build:
      context: .
    image: industrial-maintenance:local
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  maintenance-dashboard:
    image: industrial-maintenance:local
    depends_on:
      maintenance-api:
        condition: service_healthy
    environment:
      MAINTENANCE_API_URL: http://maintenance-api:8000
      MAINTENANCE_DEMO_DATA: /app/examples/fd001_demo_engine_3.csv
    command:
      - serve-maintenance-dashboard
      - --api-url
      - http://maintenance-api:8000
      - --host
      - 0.0.0.0
      - --port
      - "8501"
      - --headless
      - --demo-data
      - /app/examples/fd001_demo_engine_3.csv
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
